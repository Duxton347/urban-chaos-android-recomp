name: PC original source reproduction attempt
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/attempt_pc_build.py'
      - 'config/pc-recovery.lock.json'
      - '.github/workflows/pc-recovery.yml'
permissions:
  contents: read
jobs:
  original-windows-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
      - name: Attempt original CMake and its maintained build target
        run: python scripts/attempt_pc_build.py
      - name: Record actual outcome even on failure
        if: always()
        shell: pwsh
        run: |
          $report = 'build/pc-recovery/original-build/attempt-status.json'
          if (Test-Path $report) { Get-Content $report | Out-File -Append $env:GITHUB_STEP_SUMMARY }
      # No caching or artifact upload: only public-source build logs and bounded status.
