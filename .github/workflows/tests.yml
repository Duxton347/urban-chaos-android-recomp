name: Automated importer and compiler tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            .toolchain/downloads
            .toolchain/cmake
          key: test-tools-${{ runner.os }}-${{ hashFiles('dependencies.lock.json') }}
      - run: python3 scripts/ci_bootstrap.py --component host
      - run: scripts/build_host.sh
      - run: scripts/test.sh
      - run: python3 scripts/native_smoke.py
