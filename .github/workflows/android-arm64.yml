name: Android ARM64 portability (no game APK)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-contract:
    env:
      ANDROID_HOME: ${{ github.workspace }}/.toolchain/android-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor
            .toolchain/android-sdk
            .toolchain/downloads/cmdline.zip
          key: android-contract-${{ runner.os }}-${{ hashFiles('dependencies.lock.json') }}
      - run: python3 scripts/ci_bootstrap.py --component android
      - name: Install fixed NDK and CMake
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes)
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'ndk;28.2.13676358' 'cmake;3.31.6' 'platforms;android-34'
      - run: scripts/build_portability.sh
      - run: bash scripts/compile_android_reports.sh
      - name: Real Vulkan visibility queries with authored geometry
        run: python3 scripts/build_vulkan_reports.py
      - name: Black HLSL translator, Vulkan execution and AArch64 compiler
        run: python3 scripts/build_vulkan_shaders.py --android
      - name: Adapted Vulkan renderer interface builds (no game execution)
        run: python3 scripts/build_vulkan_renderer.py --android
      - run: python3 scripts/runtime_gate.py >> "$GITHUB_STEP_SUMMARY"
