plugins { id 'com.android.application' }
android {
 namespace 'org.urbanchaos.diagnostic'
 lint { lintConfig file('../lint.xml') }
 compileSdk 34
 ndkVersion '28.2.13676358'
 defaultConfig {
  applicationId 'org.urbanchaos.diagnostic'
  minSdk 29
  targetSdk 34
  versionCode 1
  versionName '0.1-diagnostic'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.java.srcDirs += '../../vendor/SDL/android-project/app/src/main/java'
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
 signingConfigs { debug { storeFile file('../../.toolchain/debug.keystore') } }
 buildTypes { release { minifyEnabled false } }
}
